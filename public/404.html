<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101012" />
    <title>404 — UI Forge</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; color: #f5f5f7; background: radial-gradient(circle at 80% 0%, rgb(255 59 48 / 16%), transparent 34%), radial-gradient(circle at 0% 90%, rgb(255 255 255 / 4%), transparent 26%), #101012; }
      main { width: min(100%, 660px); padding: 32px; border: 1px solid #3a3a40; border-radius: 22px; background: radial-gradient(circle at 100% 0%, rgb(255 59 48 / 12%), transparent 35%), rgb(24 24 27 / 92%); box-shadow: 0 32px 100px rgb(0 0 0 / 46%); backdrop-filter: blur(20px); }
      header { display: flex; align-items: center; gap: 11px; font-size: .78rem; font-weight: 750; }
      .mark { width: 32px; height: 32px; display: flex; align-items: end; justify-content: center; gap: 3px; padding: 7px; border: 1px solid #484850; border-radius: 11px; background: linear-gradient(145deg, #303034, #19191c); }
      .mark i { width: 3px; border-radius: 2px 2px 0 0; background: #ff3b30; }
      .mark i:nth-child(1) { height: 10px; }.mark i:nth-child(2) { height: 16px; }.mark i:nth-child(3) { height: 7px; }
      .code { display: inline-block; margin-top: 70px; color: #ff8a82; font-size: .64rem; font-weight: 750; letter-spacing: .16em; }
      h1 { max-width: 540px; margin: 9px 0 0; font-size: clamp(2.4rem, 9vw, 5rem); line-height: .9; letter-spacing: -.07em; }
      p { max-width: 480px; margin: 22px 0 0; color: #aaaab2; font-size: .82rem; line-height: 1.65; }
      a { min-height: 44px; display: inline-flex; align-items: center; margin-top: 28px; padding: 0 17px; border: 1px solid #ff655d; border-radius: 12px; color: #ffffff; background: #ff3b30; box-shadow: inset 0 1px rgb(255 255 255 / 28%), 0 10px 28px rgb(255 59 48 / 25%); font-size: .72rem; font-weight: 760; text-decoration: none; transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease; }
      a:hover { background: #ff5148; box-shadow: inset 0 1px rgb(255 255 255 / 28%), 0 13px 34px rgb(255 59 48 / 33%); transform: translateY(-1px); }
      a:focus-visible { outline: 2px solid #ff9e98; outline-offset: 3px; }
      footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 46px; padding-top: 14px; border-top: 1px solid #303036; color: #85858e; font-family: "SFMono-Regular", Consolas, monospace; font-size: .55rem; letter-spacing: .08em; text-transform: uppercase; }
      @media (max-width: 480px) { main { padding: 21px; }.code { margin-top: 52px; }footer { align-items: flex-start; flex-direction: column; } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <header><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>UI Forge</header>
      <span class="code">ERROR 404</span>
      <h1>This page doesn’t exist.</h1>
      <p>The address may be incomplete or the page may have moved. Your local design systems are still safe in this browser.</p>
      <a href="/UI---Forge/">Return to the workspace</a>
      <footer><span>Navigation fault</span><span>Workspace unaffected</span></footer>
    </main>
  </body>
</html>
