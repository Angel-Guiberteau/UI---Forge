<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#111210" />
    <title>404 — UI Forge</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; color: #ecece5; background: radial-gradient(circle at 50% 100%, rgb(242 107 63 / 14%), transparent 35%), linear-gradient(rgb(255 255 255 / 2%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 2%) 1px, transparent 1px), #111210; background-size: auto, 42px 42px, 42px 42px, auto; }
      main { width: min(100%, 660px); padding: 28px; border: 1px solid #444740; border-radius: 18px; background: radial-gradient(circle at 100% 0%, rgb(242 107 63 / 11%), transparent 35%), #181916; box-shadow: 0 28px 80px rgb(0 0 0 / 34%); }
      header { display: flex; align-items: center; gap: 11px; font-size: .78rem; font-weight: 750; }
      .mark { width: 32px; height: 32px; display: flex; align-items: end; justify-content: center; gap: 3px; padding: 7px; border: 1px solid #444740; border-radius: 7px; background: #21221f; }
      .mark i { width: 3px; border-radius: 2px 2px 0 0; background: #f26b3f; }
      .mark i:nth-child(1) { height: 10px; }.mark i:nth-child(2) { height: 16px; }.mark i:nth-child(3) { height: 7px; }
      .code { display: inline-block; margin-top: 70px; color: #ff9a78; font-family: "SFMono-Regular", Consolas, monospace; font-size: .64rem; font-weight: 700; letter-spacing: .16em; }
      h1 { max-width: 540px; margin: 9px 0 0; font-size: clamp(2.4rem, 9vw, 5rem); line-height: .9; letter-spacing: -.07em; }
      p { max-width: 480px; margin: 22px 0 0; color: #95988f; font-size: .82rem; line-height: 1.65; }
      a { min-height: 42px; display: inline-flex; align-items: center; margin-top: 28px; padding: 0 15px; border: 1px solid #654538; border-radius: 7px; color: #1a110d; background: #f26b3f; font-size: .7rem; font-weight: 760; text-decoration: none; }
      a:hover { background: #ff7a4f; transform: translateY(-1px); }
      a:focus-visible { outline: 2px solid #ffb197; outline-offset: 3px; }
      footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 46px; padding-top: 14px; border-top: 1px solid #30322d; color: #676a63; font-family: "SFMono-Regular", Consolas, monospace; font-size: .55rem; letter-spacing: .08em; text-transform: uppercase; }
      @media (max-width: 480px) { main { padding: 21px; }.code { margin-top: 52px; }footer { align-items: flex-start; flex-direction: column; } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <header><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>UI Forge</header>
      <span class="code">ERROR 404 / OFF GRID</span>
      <h1>This route was never forged.</h1>
      <p>The address may be incomplete or the page may have moved. Your local design systems are still safe in this browser.</p>
      <a href="/UI---Forge/">Return to the workspace</a>
      <footer><span>Navigation fault</span><span>Workspace unaffected</span></footer>
    </main>
  </body>
</html>
